  <!--
    Petit script, le seul en ligne (la CSP le désigne par son empreinte, voir
    tool/attente_web.py) : (1) passe l'écran d'attente en clair si le réglage « thème
    clair » de l'app est retenu sur cet appareil ; (2) demande tout de suite le
    moteur de rendu (canvaskit.js et canvaskit.wasm, la variante que le chargeur de
    Flutter choisira : mêmes tests que son flutter.js), au lieu d'attendre que
    flutter_bootstrap.js soit arrivé et lu (environ 0,7 s sur un téléphone en
    données mobiles : le moteur n'était demandé qu'à 1,06 s) ; (3) retire l'écran
    d'attente à la première image de Flutter. Placé avant les liens de polices que
    tool/web_install.sh ajoute : les deux gros fichiers partent d'abord.
  -->

  <!--

    que l'app (environ 5 Mo) se télécharge, au lieu d'une page blanche (premier

    seuls, aucun texte (rien à traduire). Lucky marche comme dans
    lib/widgets/lucky_loader.dart (quatre images, 160 ms chacune, deux fois moins vite
    quand l'appareil réduit les animations : il marche quand même, un chargement doit
    montrer qu'il avance). Animé par transform (le compositeur) plutôt que par
    background-position, qui repeint la page sur le fil principal, celui qui analyse le
    script de l'app : aucun écart mesuré sur la première image dans les deux cas (banc,
    sans capture d'écran), c'est la précaution qui ne coûte rien. Fond de la palette sombre (l'app est sombre par défaut) ;
    le petit script plus bas passe en clair si le réglage « thème clair » de l'app est
    retenu sur cet appareil. Retiré à la première image de Flutter.
    Le sprite est fabriqué par tool/attente_web.py (ne pas le retoucher à la main).
