<!DOCTYPE html>
<!--
  Contrôle anti-robots (Cloudflare Turnstile) avant l'envoi d'un code de
  connexion par mail ou la création d'une synchro. Ouverte dans un cadre par la version web, dans une
  WebView par l'app Android (lib/features/account/turnstile*.dart). Elle
  ne fait que rendre le jeton : turnstile.js. Seule page de Mirinu qui
  charge un script de Cloudflare.
-->
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; style-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>Mirinu</title>
  <link rel="stylesheet" href="turnstile.css">
  <script src="turnstile.js"></script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&amp;onload=mirinuTurnstileReady" async defer></script>
</head>
<body>
  <div id="t"></div>
</body>
</html>
