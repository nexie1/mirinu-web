<!DOCTYPE html>
<!--
  Contrôle anti-robots (Cloudflare Turnstile) avant l'envoi d'un code de
  connexion par mail, la création d'une synchro ou l'envoi d'une affiche.
  Ouverte dans un cadre par la version web, dans une WebView par l'app
  Android (lib/features/account/turnstile*.dart, RobotCheck). Elle ne fait
  que rendre le jeton et dire son état : turnstile.js (le contrat avec les
  apps y est décrit). Seule page de Mirinu qui charge un script de
  Cloudflare. Rien n'y est dessiné : l'attente, les erreurs et le bouton
  « Réessayer » sont ceux de l'app.
-->
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; style-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>Mirinu</title>
  <link rel="stylesheet" href="turnstile.css?v=2">
  <script src="turnstile.js?v=2"></script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&amp;onload=mirinuTurnstileReady" async defer></script>
</head>
<body>
  <div id="t"></div>
</body>
</html>
